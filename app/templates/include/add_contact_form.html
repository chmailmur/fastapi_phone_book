<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <form method="POST" action="/manager/submit/add">
                <h3 class="mb-4 text-center">Добавить контакт</h3>

                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" name="name" class="form-control" placeholder="Введите имя" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Возраст</label>
                    <input type="number" name="age" class="form-control" placeholder="Введите возраст" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text" name="phone" class="form-control" placeholder="+7 (___) ___-__-__" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Отправить
                </button>
            </form>

        </div>
    </div>
</div>
